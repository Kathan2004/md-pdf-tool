<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Markdown to PDF Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="ui.css" />
</head>
<body>
  <div class="bg-shape bg-shape-a" aria-hidden="true"></div>
  <div class="bg-shape bg-shape-b" aria-hidden="true"></div>

  <main class="app">
    <header class="hero">
      <p class="eyebrow">Netlify Serverless Pipeline</p>
      <h1>Markdown to HTML Studio</h1>
      <p class="subtitle">Write or upload markdown, preview it live, and download a fully readable HTML document.</p>
    </header>

    <section class="panel workspace" aria-labelledby="content-heading">
      <div class="toolbar">
        <h2 id="content-heading">Workspace</h2>
        <div class="actions-inline">
          <input id="fileInput" type="file" accept=".md,.markdown,.txt" />
          <button id="sampleBtn" type="button" class="ghost">Load Sample</button>
          <button id="convertBtn" type="button" class="primary">Download HTML</button>
        </div>
      </div>

      <div id="dropZone" class="drop-zone" role="button" tabindex="0" aria-label="Drop markdown file here">
        Drag and drop a Markdown file here
      </div>

      <div class="meta-row">
        <div class="meta-item">
          <label for="title">File name</label>
          <input id="title" type="text" placeholder="report" value="report" />
        </div>
        <div class="meta-item toc-controls" role="group" aria-label="Table of contents settings">
          <label class="checkbox-label" for="includeToc">
            <input id="includeToc" type="checkbox" checked />
            Include Index (TOC)
          </label>
          <label class="toc-depth-label" for="tocDepth">Depth</label>
          <select id="tocDepth" aria-label="TOC depth">
            <option value="1">H1</option>
            <option value="2" selected>H1-H2</option>
            <option value="3">H1-H3</option>
          </select>
        </div>
      </div>

      <div class="split-view">
        <div class="editor-col">
          <label for="markdown">Markdown</label>
          <textarea id="markdown" spellcheck="false" placeholder="# Your heading\n\nPaste markdown here..."></textarea>
        </div>

        <div id="previewPanel" class="preview-col is-hidden" aria-labelledby="live-preview-heading">
          <label id="live-preview-heading">Live Preview</label>
          <div id="previewCanvas" class="preview-canvas" aria-live="polite"></div>
        </div>
      </div>

      <div class="convert-row">
        <span id="status" class="status">Ready</span>
        <a id="downloadLink" class="download-link hidden" href="#">Download last HTML</a>
      </div>
    </section>
  </main>
  <script src="vendor/html2canvas.min.js"></script>
  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="vendor/jspdf.plugin.autotable.min.js"></script>
  <script src="ui.js"></script>
</body>
</html>
