<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Converter Studio</title>
  <meta name="description" content="Convert, compress and extract PDFs, images, data, documents and archives, plus OCR. Everything runs in your browser; nothing is uploaded." />
  <script src="assets/theme.js"></script>
  <link rel="stylesheet" href="assets/shared.css" />
</head>
<body class="home" data-page-drop="off">
  <div class="glows" aria-hidden="true"><div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div></div>

  <nav class="site-nav" aria-label="Tools">
    <div class="site-nav-inner"><a class="site-brand" href="index.html">Converter Studio</a></div>
  </nav>

  <main class="app home-main">
    <h1 class="home-title">Nothing leaves<br />your device.</h1>

    <button type="button" class="drop-orb" id="smartDrop" aria-describedby="dropHelp">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4" /><path d="M7.5 8.5L12 4l4.5 4.5" /><path d="M5 14v4.5A1.5 1.5 0 006.5 20h11a1.5 1.5 0 001.5-1.5V14" /></svg>
      <span>Drop a file</span>
    </button>
    <p id="dropHelp" class="sr-only">Drop a file anywhere, click to choose one, or paste a screenshot to read its text.</p>
    <input type="file" id="homeFiles" class="hidden-file-input" multiple />

    <section class="suggest is-hidden" id="suggest" aria-live="polite" aria-label="Suggested tools">
      <p class="suggest-meta" id="suggestMeta"></p>
      <div class="app-grid" id="suggestChips"></div>
    </section>

    <section aria-label="Popular tools" class="app-grid" id="featured"></section>
    <button type="button" class="all-link" id="showAll" aria-expanded="false" aria-controls="allTools"></button>
    <div class="all-tools is-hidden" id="allTools"></div>
  </main>

  <footer class="site-footer">Made by Kathan Somani</footer>
  <script src="assets/catalog.js"></script>
  <script src="assets/shared.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
